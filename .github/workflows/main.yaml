name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Publishing is manual and a dry run unless explicitly switched off. The typed version is
  # checked against package.json (bumped in the monorepo, which this repository mirrors) --
  # this workflow never commits, so it can't diverge from the mirror.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (x.y.z); must equal the version in package.json"
        required: true
        type: string
      dry-run:
        description: "Only check what would be published (untick to publish to npm)"
        required: true
        type: boolean
        default: true

jobs:
  codestyle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  build:
    runs-on: ubuntu-latest
    needs: [codestyle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [build]
    permissions:
      contents: write
      # npm provenance
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Check the requested version against package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "${{ inputs.version }}" ]; then
            echo "package.json is at $VERSION, not ${{ inputs.version }}; bump it in the monorepo first" >&2
            exit 1
          fi
      - name: Refuse to republish an existing version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@mugon/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@mugon/sdk@$VERSION is already published; bump the version in the monorepo first" >&2
            exit 1
          fi
      - name: Publish
        run: npm publish --provenance --access public ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag the release
        if: ${{ !inputs.dry-run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
