.mugon-sdk-js-changes:
  rules:
    - changes:
        - libraries/mugon-sdk-js/**/*

mugon-sdk-js:codestyle:
  stage: codestyle
  image: node:26-alpine
  needs: []
  allow_failure: true
  rules: !reference [.mugon-sdk-js-changes, rules]
  cache:
    key:
      files:
        - libraries/mugon-sdk-js/package-lock.json
    paths:
      - libraries/mugon-sdk-js/node_modules/
  script:
    - cd libraries/mugon-sdk-js
    - npm install --workspaces=false
    - npm run format:check

mugon-sdk-js:build:
  stage: build
  image: node:26-alpine
  rules: !reference [.mugon-sdk-js-changes, rules]
  cache:
    key:
      files:
        - libraries/mugon-sdk-js/package-lock.json
    paths:
      - libraries/mugon-sdk-js/node_modules/
  script:
    - cd libraries/mugon-sdk-js
    - npm install --workspaces=false
    - npm run build
  artifacts:
    paths:
      - libraries/mugon-sdk-js/dist/
